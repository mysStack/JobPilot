name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/controller

  helm:
    name: Helm checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint controller chart
        run: helm lint deploy/helm/jobpilot-controller

      - name: Lint catalog chart
        run: helm lint deploy/helm/jobpilot-jobs-catalog

      - name: Render controller chart
        run: helm template jobpilot deploy/helm/jobpilot-controller --namespace jobpilot >/tmp/jobpilot-controller.yaml

      - name: Render catalog chart
        run: helm template catalog deploy/helm/jobpilot-jobs-catalog --namespace jobpilot >/tmp/jobpilot-catalog.yaml
