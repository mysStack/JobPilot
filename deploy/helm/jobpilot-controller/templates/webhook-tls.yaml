{{- $secretName := include "jobpilot-controller.webhookSecretName" . -}}
{{- $serviceName := include "jobpilot-controller.fullname" . -}}
{{- $dnsNames := list $serviceName (printf "%s.%s" $serviceName .Release.Namespace) (printf "%s.%s.svc" $serviceName .Release.Namespace) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $caCert := "" -}}
{{- $tlsCert := "" -}}
{{- $tlsKey := "" -}}
{{- if $existing -}}
{{- $caCert = (index $existing.data "ca.crt" | b64dec) -}}
{{- $tlsCert = (index $existing.data "tls.crt" | b64dec) -}}
{{- $tlsKey = (index $existing.data "tls.key" | b64dec) -}}
{{- else -}}
{{- $ca := genCA (printf "%s-ca" $serviceName) 3650 -}}
{{- $certificate := genSignedCert $serviceName nil $dnsNames 3650 $ca -}}
{{- $caCert = $ca.Cert -}}
{{- $tlsCert = $certificate.Cert -}}
{{- $tlsKey = $certificate.Key -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "jobpilot-controller.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $caCert | b64enc | quote }}
  tls.crt: {{ $tlsCert | b64enc | quote }}
  tls.key: {{ $tlsKey | b64enc | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "jobpilot-controller.fullname" . }}
  labels:
    {{- include "jobpilot-controller.labels" . | nindent 4 }}
webhooks:
  - name: jobs.validate.jobpilot.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    matchPolicy: Equivalent
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    objectSelector:
      matchLabels:
        jobpilot.io/managed-by: catalog
    clientConfig:
      caBundle: {{ $caCert | b64enc | quote }}
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ $serviceName }}
        path: {{ .Values.webhook.path }}
        port: {{ .Values.service.webhookPort }}
    rules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["jobs"]
        scope: Namespaced
